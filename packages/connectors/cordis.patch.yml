# Connectors for DeepSeek Harness.
#
# 一个插件装全部数据源，不用为每个服务单独装包。
#
#   notion     : Notion 官方远程 MCP（OAuth，首次调用自动弹授权）
#   slackIndex : 复用 Notion 里的 Slack 索引检索 Slack（不需要 Slack 令牌）
#   plaud      : PLAUD 官方 stdio MCP（先登录一次：npx -y @plaud-ai/mcp@latest install）
#   custom     : 任意额外 MCP，例如 Google Drive / Docs
#
# 自定义服务示例（取消注释后填自己的值）：
#
#   custom:
#     - serverName: gdrive
#       transport: stdio
#       command: npx
#       args: ['-y', '某个-google-drive-mcp']
- insert:
    - id: connectors
      name: '@plaudai/dsh-plugin-connectors'
      config:
        notion: true
        slackIndex: true
        plaud: false
        custom: []

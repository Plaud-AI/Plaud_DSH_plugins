# Slack (Socket Mode) for DeepSeek Harness.
#
# 原生工具，不走 MCP：发消息用 Web API，收消息用 Socket Mode（免公网回调）。
#
# 配置方式（二选一）：
#   A. 在 DSH 插件页直接填下面的 token / appToken（改完重启 DSH）
#   B. 留空，改用环境变量（改完要完全退出再打开 DSH）：
#        DSH_SLACK_USER_TOKEN=xoxp-...   只读，读你所在的所有频道
#        DSH_SLACK_BOT_TOKEN=xoxb-...    发消息
#        DSH_SLACK_APP_TOKEN=xapp-...    收消息（Socket Mode），不填则只发不收
#
# 需要的东西：
#   1. Slack App（api.slack.com/apps，internal app 即可）
#      User Token Scopes（只读）: channels:read, channels:history, groups:read,
#                                 groups:history, users:read, search:read
#      Bot Token Scopes（发消息）: chat:write, channels:read
#   2. 要收消息：打开 Socket Mode → Basic Information → App-Level Tokens 生成 xapp-
#   3. Install to Workspace → 复制 User OAuth Token（xoxp-）或 Bot User OAuth Token（xoxb-）
- insert:
    - id: slack-bot
      name: '@plaudai/dsh-plugin-slackbot'
      config:
        # 令牌：xoxp-（用户，只读优先）或 xoxb-（机器人）
        token: ''
        # App-Level Token（xapp-）：填了才启动 Socket Mode 收消息
        appToken: ''
        # 模型没指定频道时的默认目标，如 '#general'
        defaultChannel: ''
        # 频道白名单，空数组=不限制
        allowedChannels: []

# Slack (official MCP) for DeepSeek Harness.
#
# Slack has no Dynamic Client Registration: the client must be a Slack app with
# a fixed app id, and the token endpoint requires a confidential client. Create
# the app once at https://api.slack.com/apps, then:
#
#   1. OAuth & Permissions → Scopes → User Token Scopes: add the scopes you
#      need (chat:write, channels:read, channels:history, groups:read,
#      groups:history, im:read, im:history, users:read, search:read.public).
#   2. Same page → Redirect URLs → add
#        http://127.0.0.1:53311/callback
#      (the port is SLACK_MCP_CALLBACK_PORT below; it must match exactly)
#   3. Basic Information → copy Client ID, Client Secret and App ID.
#   4. put them in the host environment before starting the harness:
#        SLACK_MCP_CLIENT_ID=<client id>
#        SLACK_MCP_CLIENT_SECRET=<client secret>
#        SLACK_MCP_APP_ID=<the same app id>
#
# Then the first Slack tool call opens the browser for that app's consent.
- insert:
    - id: mcp-slack
      name: '@plaudai/dsh-plugin-slack'
      config:
        serverName: slack
        toolCallTimeoutMs: 120000
        callbackPort: !!js 'Number(process.env.SLACK_MCP_CALLBACK_PORT ?? 53311)'
        clientId: !!js 'process.env.SLACK_MCP_CLIENT_ID ?? ""'
        clientSecret: !!js 'process.env.SLACK_MCP_CLIENT_SECRET ?? ""'
        tokenEndpointAuthMethod: client_secret_post
        # The user-token scopes to request; must be a subset of what the app
        # declares under User Token Scopes or Slack answers invalid_scope.
        scope: !!js 'process.env.SLACK_MCP_SCOPES ?? "chat:write,channels:read,channels:history,groups:read,groups:history,im:read,im:history,users:read,search:read.public"'
        authorizationParams:
          app_id: !!js 'process.env.SLACK_MCP_APP_ID ?? ""'
